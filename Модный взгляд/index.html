<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Модный взгляд · отчёты</title>
  <style>
    :root{--ink:#202925;--muted:#77827c;--paper:#f3f5f1;--card:#fff;--line:#e5eae4;--green:#256c4b;--green2:#dcefe3;--gold:#bd9550;--shadow:0 8px 28px #183d2912}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}
    main{max-width:960px;margin:0 auto;padding:54px 24px 72px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:18px;letter-spacing:0}
    h1{margin:34px 0 8px;font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.04em}
    .intro{margin:0;color:var(--muted);font-size:16px}
    .reports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:34px}
    .card{display:flex;flex-direction:column;min-height:220px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
    .eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h2{margin:14px 0 8px;font-size:22px;line-height:1.25}
    .desc{margin:0 0 24px;color:var(--muted)}
    .link{margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:11px 15px;border-radius:10px;background:var(--green);color:white;font-weight:700;text-decoration:none}
    .link:hover{background:#1d573c}
    @media(max-width:620px){main{padding:34px 18px 50px}.reports{grid-template-columns:1fr}.card{min-height:190px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">М</div><div>Модный взгляд</div></div>
    <h1>Отчёты</h1>
    <p class="intro">Продажи и остатки по оправам и готовым очкам.</p>
    <section class="reports" aria-label="Отчёты">
      <article class="card">
        <div class="eyebrow">Продажи</div>
        <h2>Отчёт по продажам</h2>
        <p class="desc">Продажи оправ с выбором периода, филиала и других параметров.</p>
        <a class="link" href="../sales.html">Открыть отчёт <span aria-hidden="true">→</span></a>
      </article>
      <article class="card">
        <div class="eyebrow">Остатки</div>
        <h2>Отчёт по остаткам</h2>
        <p class="desc">Оправы и готовые очки, числящиеся на складе.</p>
        <a class="link" href="../stock.html">Открыть отчёт <span aria-hidden="true">→</span></a>
      </article>
    </section>
  </main>
</body>
</html>
